<style>
main.wrap { padding-block: 24px 24px; display: grid; gap: 20px; }
[hidden] { display: none !important; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.jump a { text-decoration: none; font-weight: 700; font-size: 14px; color: var(--ink); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
.jump a:hover { border-color: var(--teal); }
.jump a[aria-current="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.jump a .n { opacity: .7; font-weight: 600; margin-left: 4px; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.top input { max-width: 320px; }
.status { font-size: 13px; color: var(--soft); margin: 0; }
.intro { background: color-mix(in srgb, var(--violet) 12%, var(--card)); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; font-size: 14px; line-height: 1.55; margin: 0; }
.intro p { margin: 0 0 6px; } .intro p:last-child { margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.q.open { grid-column: 1 / -1; }
.q .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.q h3 { margin: 0; font-size: 17px; line-height: 1.3; }
.q .group { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 0 0 2px; }
.pts { white-space: nowrap; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--teal) 16%, var(--card)); color: var(--ink); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--violet) 18%, var(--card)); margin-right: 6px; }
.q .sum { margin: 0; color: var(--soft); font-size: 14px; }
.q .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.q .acts button { font-size: 13px; padding: 7px 12px; }
.q .more { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.q .desc p { margin: 0 0 8px; line-height: 1.6; max-width: 70ch; }
.q .desc h4 { margin: 10px 0 4px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.q .desc ul { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 3px; }
.cmd { display: grid; gap: 6px; }
.cmd code { display: block; background: var(--code); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; font-family: var(--f-mono, 'Roboto Mono', monospace); font-size: 12.5px; overflow-wrap: anywhere; }
.cmd .lbl { font-size: 12px; font-weight: 600; color: var(--soft); }
.cmd .note { font-size: 14px; font-weight: 600; }
.empty { color: var(--soft); font-size: 14px; }
</style>

n, and the village has one job left before the snow: make it last until spring. Somewhere cool and tucked out of the wind, every barrel, sack, and shelf is spoken for. Whoever runs this place knows exactly what's in it and how long it'll hold...\n\nMust-haves:\n• Built partly into the ground or a hillside (a cellar, a dug-out, under a rock)\n• At least 4 different kinds of goods, stored in different ways (barrels, shelves, hanging, crates)\n• A way of keeping it organized, like signs, labels, or clear sections\n• A spot that belongs to the keeper (a desk, a stool and lantern, a tally on the wall)\n• Winter pressing in from outside: snow, frost, or a sealed-up entrance\n\nEvery quest also needs: a finished outside and a dressed-up inside; signs of use (something left mid-task, a personal touch, a reason it exists); a fit with the land (worked into the terrain, a path leading in, surroundings dressed); and lighting so it looks good after dark. You have 1 to 5 hours for each quest.", "/builder submit_project project_client: @comfybuilder project_type: Odin's Architect - Winter Stores speciality_category: Odin's Arch Quest duration: image:", ""], ["Odin’s Architect Quests", "", "Smokehouse", "", "1 - 5", "No", "Build a working smokehouse at the edge of camp.", "Thin smoke curls out of a little shed at the edge of camp, and everyone downwind knows exactly what's going on in there. This is a working building, so it should look worked in: a place to cut and prep, a place to smoke, and a growing pile of what's already done.\n\nMust-haves:\n• A smoke source with somewhere for the smoke to go (vent, chimney, or slatted roof)\n• At least 2 cooking stations\n• Meat at different stages: fresh, hanging to smoke, and finished and stored\n• A separate prep area from the smoking area\n• Fuel on hand, like a woodpile or stacked logs\n\nEvery quest also needs: a finished outside and a dressed-up inside; signs of use (something left mid-task, a personal touch, a reason it exists); a fit with the land (worked into the terrain, a path leading in, surroundings dressed); and lighting so it looks good after dark. You have 1 to 5 hours for each quest.", "/builder submit_project project_client: @comfybuilder project_type: Odin's Architect - Smokehouse speciality_category: Odin's Arch Quest duration: image:", ""], ["Odin’s Architect Quests", "", "Ice Fishing Hut", "", "1 - 5", "No", "Build a tiny shelter at the edge of the cold water.", "Out on the edge of the cold water, someone built a tiny shelter just big enough for a fire, a seat, and a lot of patience. They come back every day, whether the fish bite or not, so the hut has slowly filled up with their stuff and their stories.\n\nMust-haves:\n• Built at the water's edge or out over it (on a pier, stilts, or the shoreline)\n• A fire and somewhere to sit\n• Fishing gear and the day's catch on display\n• Signs of a regular: a tally of fish, a bed, a lucky charm, a carved sign\n\nEvery quest also needs: a finished outside and a dressed-up inside; signs of use (something left mid-task, a personal touch, a reason it exists); a fit with the land (worked into the terrain, a path leading in, surroundings dressed); and lighting so it looks good after dark. You have 1 to 5 hours for each quest.", "/builder submit_project project_client: @comfybuilder project_type: Odin's Architect - Ice Fishing Hut speciality_category: Odin's Arch Quest duration: image:", ""], ["Odin’s Architect Quests", "", "Snowed-In Workshop", "", "1 - 5", "No", "Build a crafter's workshop buried in snow.", "The snow is up to the windows, and the crafter inside could not care less. There's a project on the bench they've been chasing for weeks, tools everywhere, and a fire keeping their fingers working. You pick the craft (woodworker, smith, toymaker, something else), but nobody should need a sign to guess what they make.\n\nMust-haves:\n• An entrance that looks snowed in\n• A project visibly in progress\n• Tools and materials that match the craft\n• A hearth, forge, or fire with proper venting\n• A spot where the crafter eats, rests, and sleeps between work\n\nEvery quest also needs: a finished outside and a dressed-up inside; signs of use (something left mid-task, a personal touch, a reason it exists); a fit with the land (worked into the terrain, a path leading in, surroundings dressed); and lighting so it looks good after dark. You have 1 to 5 hours for each quest.", "/builder submit_project project_client: @comfybuilder project_type: Odin's Architect - Snowed-In Workshop speciality_category: Odin's Arch Quest duration: image:", ""], ["Odin’s Architect Quests", "", "Signal Fire Post", "", "1 - 5", "No", "Build a watchtower home with a signal fire on top.", "High on a cold ridge, a stone watchtower keeps an eye on the hills. Up top, a fire is stacked and ready to light the moment trouble shows. Down below, the keeper has turned the tower into a home for the long winter: somewhere to sleep, eat, and stay warm between watches.\n\nMust-haves:\n• A tower at least 3 floors or levels tall, built on high ground\n• A signal fire at the top, ready to light (or already lit)\n• A home inside: a bed, a hearth, a kitchen, and a small workshop with at least one work table\n• A watch log or lookout spot\n• A way up that feels part of the build, like a winding stair, ladders, or a cliff path\n\nEvery quest also needs: a finished outside and a dressed-up inside; signs of use (something left mid-task, a personal touch, a reason it exists); a fit with the land (worked into the terrain, a path leading in, surroundings dressed); and lighting so it looks good after dark. You have 1 to 5 hours for each quest.", "/builder submit_project project_client: @comfybuilder project_type: Odin's Architect - Signal Fire Post speciality_category: Odin's Arch Quest duration: image:", ""], ["Slayers", "https://discord.com/channels/820120530107367435/1387233164166037715/1514458939864125533", "Tower Defence Event", "", "1", "No", "Be the b  "Ranger Stations - Igloo", "https://docs.google.com/spreadsheets/d/1iRH4C7ml1sJIiX_O175pBhP0m78sWjBM9-i37DWtCdc/edit?gid=897323579", "0.5", "No", "Complete the Igloo Ranger Station.", "Complete the Igloo Ranger Station with the Rangers.", "/builder submit_collab collab_name:Ranger Stations - Igloo duration: collab_url: image:", ""], ["Rangers", "https://discord.com/channels/820120530107367435/1387233164166037715/1514458801250767039", "Ranger Stations - Demistification", "https://docs.google.com/spreadsheets/d/1iRH4C7ml1sJIiX_O175pBhP0m78sWjBM9-i37DWtCdc/edit?gid=897323579", "0.5", "No", "Complete the Demistification Ranger Station.", "Complete the Demistification Ranger Station with the Rangers.", "/builder submit_collab collab_name:Ranger Stations - Demistification duration: collab_url: image:", ""]];        // copy of the sheet, used only if the live sheet can't be reached
  // ==================================================

  var $ = function (id) { return document.getElementById(id); };
  var az = function (a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(t) { return String(t || '').replace(/[‘’]/g, "'").trim(); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var tt; function toast(m) { var el = $('toast'); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 2600); }
  function copy(text, done) {
    var fb = function () { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? done : 'Select the text and copy it by hand.'); };
    try { navigator.clipboard.writeText(text).then(function () { toast(done); }, fb); } catch (e) { fb(); }
  }

  function parseCSV(text) {
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }

  var ITEMS = [], WEEKS = [], tab = 'activities', openId = null, bcOpened = false;

  function loadWeeks(rows) {
    var head = (rows[0] || []).map(function (h) { return norm(h).toLowerCase(); });
    var c = function (n) { return head.indexOf(n); };
    if (c('week') < 0 || c('status') < 0) return false;
    WEEKS = rows.slice(1).filter(function (r) { return norm(r[c('week')]); }).map(function (r) {
      var g = function (n) { return c(n) < 0 ? '' : String(r[c(n)] || '').trim(); };
      return { id: 'w' + g('week'), week: g('week'), out: /^out$/i.test(g('status')), name: g('title'), opens: g('opens'), due: g('due'),
        wisdom: g('builder wisdom'), reqs: g('requirements'), c1: g('command') };
    }).sort(function (a, b) { return Number(a.week) - Number(b.week); });
    return true;
  }

  function load(rows) {
    var head = (rows[0] || []).map(function (h) { return norm(h).toLowerCase(); });
    var col = function (n) { return head.indexOf(n); };
    var C = { section: col('section'), name: col('activity'), rules: col('rules link'), points: col('points'), summary: col('summary'), desc: col('description'), c1: col('command 1'), c2: col('command 2') };
    if (C.name < 0 || C.section < 0) return false;
    ITEMS = rows.slice(1).map(function (r, i) {
      var g = function (k) { return C[k] < 0 ? '' : norm(r[C[k]]); };
      var summary = g('summary'), tag = '';
      var m = summary.match(/\s*\((Seasonal[^)]*)\)\s*$/i);
      if (m) { tag = m[1]; summary = summary.slice(0, m.index); }
      return { id: 'i' + i, section: g('section'), name: g('name'), rules: g('rules'), points: g('points'), summary: summary, tag: tag,
        desc: String(C.desc < 0 ? '' : (r[C.desc] || '')).replace(/[‘’]/g, "'").trim(), c1: g('c1'), c2: g('c2') };
    }).filter(function (x) { return x.name; });
    return true;
  }

  function tabOf(id) { return TABS.filter(function (t) { return t.id === id; })[0] || TABS.filter(function (t) { return t.id === 'activities'; })[0]; }
  function itemsFor(t) { if (t.bootcamp) return WEEKS.filter(function (w) { return w.out; }); return ITEMS.filter(function (x) { return t.sections.indexOf(x.section) >= 0; }); }
  function pts(p) {
    if (!p) return '';
    if (/^[\d.]+$/.test(p)) return p + (p === '1' ? ' point' : ' points');
    if (/^[\d.]+\s*(-|or)\s*[\d.]+$/.test(p)) return p.replace(/\s*-\s*/, ' to ').replace(/\s*or\s*/, ' or ') + ' points';
    return p;
  }

  // description text -> paragraphs, small headings and bullet lists
  function descHTML(text, t) {
    var paras = text.split(/\n\s*\n/);
    if (t.liftPara) paras = paras.filter(function (p) { return p.trim().indexOf(t.liftPara) !== 0; });
    var out = '';
    paras.forEach(function (p) {
      (t.strip || []).forEach(function (s) { p = p.split(s).join(''); });
      var lines = p.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
      var list = [];
      var flush = function () { if (list.length) { out += '<ul>' + list.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>'; list = []; } };
      lines.forEach(function (l) {
        if (/^[•\-*]\s*/.test(l)) list.push(l.replace(/^[•\-*]\s*/, ''));
        else if (/^[^.]{2,30}:$/.test(l)) { flush(); out += '<h4>' + esc(l.slice(0, -1)) + '</h4>'; }
        else { flush(); out += '<p>' + esc(l) + '</p>'; }
      });
      flush();
    });
    return out;
  }

  function isCmd(c) { return /^\//.test(c); }
  function cmdHTML(c, label) {
    if (!c) return '';
    if (!isCmd(c)) return '<div class="cmd"><span class="lbl">' + esc(label) + '</span><span class="note">' + esc(c) + '</span></div>';
    return '<div class="cmd"><span class="lbl">' + esc(label) + '</span><code>' + esc(c) + '</code></div>';
  }

  function renderTabs() {
    $('tabs').innerHTML = TABS.map(function (t) {
      return '<a href="#' + t.id + '" data-tab="' + t.id + '" aria-current="' + (t.id === tab) + '">' + esc(t.label) + '<span class="n">' + itemsFor(t).length + '</span></a>';
    }).join('');
  }

  function reqHTML(text) {
    var out = '', list = [], sub = null;
    var flush = function () { if (list.length) { out += '<ul>' + list.map(function (l) { return '<li>' + esc(l.t) + (l.sub.length ? '<ul>' + l.sub.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</li>'; }).join('') + '</ul>'; list = []; } };
    text.split('\n').forEach(function (l) {
      if (/^\s{2,}-\s/.test(l) && list.length) list[list.length - 1].sub.push(l.replace(/^\s*-\s/, ''));
      else if (/^-\s/.test(l)) list.push({ t: l.slice(2), sub: [] });
      else if (l.trim()) { flush(); out += '<p>' + esc(l.trim()) + '</p>'; }
    });
    flush();
    return out;
  }

  function renderBootcamp(t) {
    var out = WEEKS.filter(function (w) { return w.out; }), coming = WEEKS.filter(function (w) { return !w.out; });
    var latest = out.length ? out[out.length - 1].id : null;
    if (!bcOpened && latest) { openId = latest; bcOpened = true; }
    var intro = [BOOTCAMP_INTRO];
    if (!WEEKS.length) intro.push('Bootcamp weeks show up here as they are given out.');
    else if (!out.length) intro.push('Bootcamp starts ' + coming[0].opens + '. Each new week shows up here when it is given out.');
    else if (coming.length) intro.push('Week ' + coming[0].week + ' opens ' + coming[0].opens + '.');
    else intro.push('All ' + out.length + ' weeks are out. Finish strong!');
    $('intro').hidden = false;
    $('intro').innerHTML = intro.map(function (p, i) { return '<p' + (i ? ' style="font-weight:700"' : '') + '>' + esc(p) + '</p>'; }).join('');
    var term = $('q').value.trim().toLowerCase();
    var list = out.filter(function (w) { return !term || (w.name + ' ' + w.reqs + ' ' + w.wisdom).toLowerCase().indexOf(term) >= 0; });
    if (!list.length) { $('cards').innerHTML = out.length ? '<p class="empty">Nothing matches that search.</p>' : ''; return; }
    $('cards').innerHTML = list.map(function (w) {
      var open = w.id === openId;
      return '<article class="q' + (open ? ' open' : '') + '" data-id="' + w.id + '">' +
        '<div class="hd"><div><p class="group">Week ' + esc(w.week) + (w.id === latest ? ' · this week' : '') + '</p><h3>' + esc(w.name) + '</h3></div></div>' +
        (w.due ? '<p class="sum">Due ' + esc(w.due) + '</p>' : '') +
        '<div class="acts"><button type="button" data-act="more" aria-expanded="' + open + '">' + (open ? 'Less' : 'Details') + '</button>' +
        (isCmd(w.c1) ? '<button type="button" data-act="copy" data-c="1">Copy</button>' : '') +
        '<button type="button" data-act="proj">Start project</button></div>' +
        (open ? '<div class="more"><div class="desc">' + (w.wisdom ? '<h4>Builder Wisdom</h4><p><em>' + esc(w.wisdom) + '</em></p>' : '') +
          '<h4>Requirements</h4>' + reqHTML(w.reqs) + '</div>' + cmdHTML(w.c1, 'Command to submit') +
          (w.due ? '<p class="sum" style="margin:0">Full point until ' + esc(w.due) + ', half a point after.</p>' : '') + '</div>' : '') +
        '</article>';

  }

  function render() {
    var t = tabOf(tab);
    renderTabs();
    if (t.bootcamp) { renderBootcamp(t); return; }
    var intro = (t.intro || []).slice();
    if (t.liftPara) {
      var src = itemsFor(t)[0];
      var lifted = src && src.desc.split(/\n\s*\n/).filter(function (p) { return p.trim().indexOf(t.liftPara) === 0; })[0];
      if (lifted) intro.push(lifted.trim());
    }
    $('intro').hidden = !intro.length;
    $('intro').innerHTML = intro.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var term = $('q').value.trim().toLowerCase();
    var list = itemsFor(t).filter(function (x) { return !term || (x.name + ' ' + x.summary + ' ' + x.desc + ' ' + x.section).toLowerCase().indexOf(term) >= 0; });
    list.sort(function (a, b) { return t.showGroup ? (az(a.section, b.section) || az(a.name, b.name)) : az(a.name, b.name); });
    if (!list.length) { $('cards').innerHTML = '<p class="empty">' + (term ? 'Nothing matches that search.' : 'Nothing here yet this era.') + '</p>'; return; }
    $('cards').innerHTML = list.map(function (x) {
      var open = x.id === openId;
      var proj = t.project && (t.project.byGroup ? t.project.byGroup[x.section] : t.project);
      return '<article class="q' + (open ? ' open' : '') + '" data-id="' + x.id + '">' +
        '<div class="hd"><div>' + (t.showGroup ? '<p class="group">' + esc(x.section) + '</p>' : '') + '<h3>' + esc(x.name) + '</h3></div>' +
        (x.points ? '<span class="pts">' + esc(pts(x.points)) + '</span>' : '') + '</div>' +
        '<p class="sum">' + (x.tag ? '<span class="tag">' + esc(x.tag) + '</span>' : '') + esc(x.summary) + '</p>' +
        '<div class="acts"><button type="button" data-act="more" aria-expanded="' + open + '">' + (open ? 'Less' : 'Details') + '</button>' +
        (isCmd(x.c1) ? '<button type="button" data-act="copy" data-c="1">Copy</button>' : '') +
        (proj ? '<button type="button" data-act="proj">Start project</button>' : '') + '</div>' +
        (open ? '<div class="more"><div class="desc">' + descHTML(x.desc, t) + '</div>' +
          cmdHTML(x.c1, x.c2 ? 'Command' : 'Command to submit') +
          (x.c2 ? cmdHTML(x.c2, 'Or, as a Showcase Build') + '<button type="button" data-act="copy" data-c="2" style="justify-self:start">Copy Showcase command</button>' : '') +
          (/^https:\/\//.test(x.rules) ? '<a href="' + esc(x.rules) + '" target="_blank" rel="noopener">Read the full rules ↗</a>' : '') + '</div>' : '') +
        '</article>';
    }).join('');
  }

  function find(id) { return ITEMS.concat(WEEKS).filter(function (x) { return x.id === id; })[0]; }

  function startProject(x) {
    var t = tabOf(tab);
    var pr = t.project.byGroup ? t.project.byGroup[x.section] : t.project;
    var d; try { d = JSON.parse(store(KEY) || 'null'); } catch (e) { d = null; }
    d = d && d.projects ? d : { projects: [], sessions: [], running: null };
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    var fields = {};
    if (pr.field === 'activity' || pr.field === 'quest') fields[pr.field] = x.name;
    if (pr.field === 'week') {
      fields.week = x.week;
      var musts2 = x.reqs.split('\n').filter(function (l) { return /^\s*-\s/.test(l); }).map(function (l) { return (/^\s{2,}/.test(l) ? '  ' : '') + l.replace(/^\s*-\s/, ''); });
      d.projects.push({ id: id, name: 'Bootcamp Week ' + x.week + ': ' + x.name, type: pr.type, fields: fields, created: Date.now(),
        brief: { title: 'Bootcamp Week ' + x.week + ': ' + x.name, story: x.wisdom, style: '', musts: musts2 } });
      if (store(KEY, JSON.stringify(d)) === null && !store(KEY)) { toast('Could not save. Is this a private window?'); return; }
      store(KEY + '.sel', id); location.href = 'projects.html'; return;
    }
    var paras = x.desc.split(/\n\s*\n/).filter(function (p) { return !t.liftPara || p.trim().indexOf(t.liftPara) !== 0; });
    var musts = [], story = [];
    paras.join('\n').split('\n').forEach(function (l) { l = l.trim(); if (!l) return; if (/^[•\-*]\s*/.test(l)) musts.push(l.replace(/^[•\-*]\s*/, '')); else if (!/^[^.]{2,30}:$/.test(l)) story.push(l); });
    (t.strip || []).forEach(function (s) { story = story.map(function (l) { return l.split(s).join('').trim(); }).filter(Boolean); });
    d.projects.push({ id: id, name: x.name, type: pr.type, fields: fields, created: Date.now(),
      brief: { title: t.label + ': ' + x.name, story: story.join('\n'), style: '', musts: musts } });
    if (store(KEY, JSON.stringify(d)) === null && !store(KEY)) { toast('Could not save. Is this a private window?'); return; }
    store(KEY + '.sel', id);
    location.href = 'projects.html';
  }

  $('cards').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var x = find(b.closest('.q').dataset.id); if (!x) return;
    if (b.dataset.act === 'more') { openId = openId === x.id ? null : x.id; render(); }
    else if (b.dataset.act === 'copy') copy(b.dataset.c === '2' ? x.c2 : x.c1, 'Copied. Paste it in Discord and fill in the blanks.');
    else if (b.dataset.act === 'proj') startProject(x);
  });
  $('tabs').addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return; e.preventDefault();
    tab = a.dataset.tab; openId = null; $('q').value = '';
    try { history.replaceState(null, '', '#' + tab); } catch (x) {}
    render();
  });
  $('q').addEventListener('input', render);
  window.addEventListener('hashchange', function () { tab = tabOf(location.hash.slice(1)).id; render(); });
  tab = tabOf(location.hash.slice(1)).id;

  // Show the saved copy right away, then swap in the live sheet
  var cached = null; try { cached = JSON.parse(store('tbQuests.cache') || 'null'); } catch (e) {}
  load(cached && cached.rows ? cached.rows : SNAPSHOT);
  $('status').textContent = 'Loading the latest from the tracker...';
  render();
  fetch(CSV_URL, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (txt) {
    var rows = parseCSV(txt);
    if (!load(rows)) { $('status').textContent = 'The tracker link is not pointing at the Earning Points Data tab. Showing the last saved copy.'; load(cached && cached.rows ? cached.rows : SNAPSHOT); render(); return; }
    store('tbQuests.cache', JSON.stringify({ rows: rows, at: Date.now() }));
    $('status').textContent = 'Up to date with the Player Tracker.';
    render();
  }).catch(function () {
    $('status').textContent = 'Could not reach the tracker, showing the last saved copy.';
  });
  var bc = null; try { bc = JSON.parse(store('tbBootcamp.cache') || 'null'); } catch (e) {}
  if (bc && bc.rows) { loadWeeks(bc.rows); render(); }
  if (BOOTCAMP_URL) fetch(BOOTCAMP_URL, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (txt) {
    var rows = parseCSV(txt);
    if (!loadWeeks(rows)) throw 0;
    store('tbBootcamp.cache', JSON.stringify({ rows: rows, at: Date.now() }));
    render();
  }).catch(function () {});
})();
</script>
</body>
</html>
